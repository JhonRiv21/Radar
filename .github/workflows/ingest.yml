name: Consumo de amenazas

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuración
        id: check
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RADAR_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Faltan los secrets RADAR_URL y/o CRON_SECRET. Ingesta omitida."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar ingesta
        if: steps.check.outputs.ready == 'true'
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # El cuerpo se descarta: el repo es público y la respuesta de error
          # puede traer detalles de la base de datos.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${RADAR_URL%/}/api/cron/ingest")
          echo "HTTP $code"
          test "$code" = "200"
